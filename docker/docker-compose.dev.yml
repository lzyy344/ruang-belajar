version: '3.8'

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ruang-belajar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ruang_belajar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruang_belajar"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ruang-belajar-network

  # =============================================================================
  # Redis (Cache & BullMQ Queue)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: ruang-belajar-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ruang-belajar-network

  # =============================================================================
  # MinIO (S3 Compatible Storage)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: ruang-belajar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ruang-belajar-network

  # =============================================================================
  # MinIO Bucket Initialization
  # =============================================================================
  minio-init:
    image: minio/mc:latest
    container_name: ruang-belajar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        until (/usr/bin/mc config host add minio http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio...' && sleep 2; done;
        /usr/bin/mc mb minio/ruang-belajar --ignore-existing;
        /usr/bin/mc anonymous set public minio/ruang-belajar/public;
        /usr/bin/mc policy set public minio/ruang-belajar/public;
        echo 'MinIO bucket initialized';
      "
    networks:
      - ruang-belajar-network

  # =============================================================================
  # Mailhog (Email Testing)
  # =============================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ruang-belajar-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - ruang-belajar-network

  # =============================================================================
  # Frontend (Next.js Dev Server)
  # =============================================================================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ruang-belajar-web
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ruang_belajar?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-super-secret-key-min-32-chars-change-in-production}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_NEXTAUTH_URL=http://localhost:3000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=ruang-belajar
      - S3_REGION=us-east-1
      - NEXT_PUBLIC_S3_PUBLIC_URL=http://localhost:9000/ruang-belajar
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - MAX_FILE_SIZE_MB=500
      - WORKER_CONCURRENCY=2
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ruang-belajar-network
    stdin_open: true
    tty: true

  # =============================================================================
  # API Worker (Background Jobs)
  # =============================================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: ruang-belajar-worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ruang_belajar?schema=public
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=ruang-belajar
      - S3_REGION=us-east-1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - WORKER_CONCURRENCY=2
      - JOB_DEFAULT_ATTEMPTS=3
    volumes:
      - ../apps/api:/app
      - ../packages:/packages
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ruang-belajar-network
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ruang-belajar-network:
    driver: bridge